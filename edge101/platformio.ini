; EDGE 101 (DFR1283) 分拣控制器 — 实现 docs/sort-mqtt.md 协议
; 板载 RJ45 以太网 + HuskyLens 2 (UART GPIO5/12) + 步进 (STEP=14 DIR=15)
; + 3 路舵机 (PCA9685 I2C, SDA=18 SCL=23) + 2Hz 遥测
;
; 板级: ESP32 原版 (双核 LX6 @240MHz, 16MB Flash, 无 PSRAM) — 见 config.h 头注
;
; 构建:
;   pio run            # 交叉编译
;   pio run -t upload  # 烧录 (Type-C USB; 必要时按住复位/BOOT 进下载模式)
;   pio device monitor # 115200 串口监视
; 主机侧协议/解析单测 (无需硬件):
;   ./tests/host/run_tests.sh
;
; 注: 首次构建自动下载 espressif32 平台 + xtensa 工具链 (~500MB).
;     板载 PHY 由 arduino-esp32 的 ETH.begin() 通过 MDIO 自动识别, 无需 SPI 模块.

[platformio]
default_envs = edge101
include_dir = .

[env:edge101]
platform = espressif32
board = esp32dev                 ; 通用 ESP32 WROOM-32 目标, 与 EDGE101 主控一致
; 16MB 片上 Flash (EDGE101 规格), 需要比默认 4MB 更大的 flash 分区布局
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    nickpurdal/PubSubClient
    bblanchon/ArduinoJson
