<script type="module">
import * as THREE from 'three'
const { Lab, MAT, GEO, clamp, lerp, fmt } = window.LabKit

// ============================================================================
// 调研 (DFRobot 工业分拣线 · edge101 @192.168.2.2, 数据来自仓库配置/实机实测)
//   皮带: 42 步进 + SERVO42C 闭环, 0.0525 m/s (52.5 mm/s), 上游→下游 (+x)
//   IR T0: 透过式红外, 唯一触发点 (件到推杆 b 的时刻 = d_b / v)
//   仓距: 2026-11-11 真机 9 点标定 (config.h BIN_DIST_MM): 125 / 187 / 239 mm
//   推杆: 宽角伺服 270°(回)→−80°(伸), 伸出 600 ms / 缩 900 ms, 停带推送, 单件 ~0.9 s
//   视觉: HuskyLens2 俯视, YOLOv8n 定制模型 dfrobot_industrial_sorting
//         (864×486 BG3P, conf 0.45, nms 0.2, 15 fps), 4 类:
//         超声波 / 人体红外(PIR) / 温湿度 / 角度
//   故障: HL2 固件 FIFO 24 槽, 幻影件重复下发 → 队列满 → FAULT 锁存+停带
//         (2026-11-16 实机事故; 8c07198 存在性去重后已根治, 此页可作 Break-It)
//   假设尺寸 (无图纸): 皮带 0.62×0.12 m, 带面顶 h=0.34 m, 铝型材框架;
//         推杆 = 宽角伺服 + Scotch-yoke (直槽滑块) 曲柄连杆, 推板行程 35 mm
// ============================================================================
const V = 0.0525
const X_CAM = -0.160, X_IR = -0.050
const X_B = [0.075, 0.137, 0.189]
const EJECT_S = 0.2, RETRACT_S = 0.2, HOLD_S = 0.05   // 推杆整程 ≈0.45s (按用户指定: 推出0.2/收回0.2/保持0.05); 设备模式 ts=1 → 真实时间即此值
const FIFO = 24
const CRANK_Z = -0.1335, R = 0.035, ROD_L = 0.1325    // Scotch-yoke 在皮带对向侧 (−z): 行程 2R = 70 mm; ready(内位)推头面缩到带边外 5 mm(收回), 推出(外位)推头面越 +z 带边 3 mm 把工件推过带边进仓
const ITEM_Z0 = -0.004                                 // 上料位置 (带面中线, 略偏推杆侧)
const KINDS = ['ultrasonic_sensor', 'pir_sensor', 'angle_sensor', 'temp_humidity_sensor']
const MATCN = { angle_sensor: '角度传感器', ultrasonic_sensor: '超声波传感器', pir_sensor: '人体红外传感器', temp_humidity_sensor: '温湿度传感器' }
const MATMAP = { angle_sensor: 1, ultrasonic_sensor: 2, pir_sensor: 3, temp_humidity_sensor: 1 }  // 测试占位映射 (无指令兜底)
const MATCOL = { angle_sensor: [0.38, 0.65, 0.98], ultrasonic_sensor: [0.98, 0.569, 0.243], pir_sensor: [0.945, 0.318, 0.318], temp_humidity_sensor: [0.45, 0.25, 0.85] }

const lab = new Lab({
  prompt: 'DFRobot 工业分拣线: 52.5 mm/s 皮带 · 3 个伺服推杆 · HuskyLens2 俯视识别 4 类传感器 · IR T0 触发 · 45° 滑道分仓 (edge101 数字孪生)',
  no: 101, title: 'DFRobot 工业分拣线', sub: 'edge101 · 52.5 mm/s · IR T0 · 3 推杆 · HL2',
  size: 0.66,
  theme: 'night',
  view: { az: 42, el: 16, dist: 2.2, target: [0.01, 0.31, 0.03], fov: 30 },
  cut: { a: [0, 0, 1], b: [0, 1, 0] },
  pills: ['three.js 0.170', 'PBR', 'machine-skill', 'digital twin'],
})

// ---------- 材质 ----------
const M = {
  frame:  MAT.paint({ color: [0.10, 0.11, 0.125], roughness: 0.5, clearcoat: 0.25 }),
  rail:   MAT.paint({ color: [0.14, 0.15, 0.17], roughness: 0.45, clearcoat: 0.3 }),
  rubber: MAT.rubber({ color: [0.05, 0.05, 0.055] }),
  belt: MAT.rubber({ color: [0.10, 0.42, 0.15] }),
  steel:  MAT.steel({ roughness: 0.28 }),
  alu:    MAT.aluminium({ roughness: 0.4 }),
  aluM:   MAT.aluminiumMachined({ roughness: 0.22 }),
  dark:   MAT.paint({ color: [0.07, 0.07, 0.08], roughness: 0.55 }),
  pcb:    MAT.paint({ color: [0.03, 0.16, 0.09], roughness: 0.5 }),
  gold:   MAT.brass({ roughness: 0.3 }),
  white:  MAT.paint({ color: [0.93, 0.93, 0.94], roughness: 0.22, clearcoat: 0.9 }),
  chute:  MAT.stainless({ color: [0.60, 0.63, 0.66], roughness: 0.55, finish: 'brushed' }),
  chuteSide: MAT.stainless({ color: [0.55, 0.58, 0.62], roughness: 0.5, finish: 'brushed' }),
  glass:  MAT.glass(),
  hlLed:  MAT.glow({ emissive: [0.35, 1.0, 0.55], emissiveIntensity: 1.2 }),
  beacon: MAT.glow({ emissive: [1.0, 0.18, 0.12], emissiveIntensity: 0.12 }),
}
M.chute.side = THREE.DoubleSide
M.chuteSide.side = THREE.DoubleSide

// 皮带面滚花纹理 (滚动 → 带面运动感)
const TREAD_TILE = 0.04
const treadTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128
  const g = c.getContext('2d')
  g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, 256, 128)
  g.strokeStyle = '#8f8f8f'; g.lineWidth = 7
  for (let x = -64; x < 320; x += 32) { g.beginPath(); g.moveTo(x, -8); g.lineTo(x + 18, 64); g.lineTo(x, 136); g.stroke() }
  const t = new THREE.CanvasTexture(c)
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.repeat.set(0.62 / TREAD_TILE, 1)
  return t
})()
const beltTopM = MAT.rubber({ color: [0.10, 0.42, 0.15], map: treadTex, roughness: 0.9 })

function textTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  draw(c.getContext('2d'), w, h)
  const t = new THREE.CanvasTexture(c)
  t.colorSpace = THREE.SRGBColorSpace
  return t
}

// ---------- 结构 (全部真实米制) ----------
const frame = new THREE.Group()
const railL = new THREE.Group(), railR = new THREE.Group()
for (const [grp, z] of [[railL, -0.075], [railR, 0.075]]) {
  const r = new THREE.Mesh(GEO.rbox(0.62, 0.045, 0.03, 0.008), M.rail)
  r.position.set(0, 0.3135, z)
  grp.add(r)
}
frame.add(railL, railR)
const endL = new THREE.Mesh(GEO.rbox(0.012, 0.045, 0.175, 0.004), M.frame); endL.position.set(-0.326, 0.3135, 0)
const endR = new THREE.Mesh(GEO.rbox(0.012, 0.045, 0.175, 0.004), M.frame); endR.position.set(0.326, 0.3135, 0)
frame.add(endL, endR)
const legs = new THREE.Group(), feet = new THREE.Group(), braces = new THREE.Group()
for (const x of [-0.28, 0.28]) for (const z of [-0.095, 0.095]) {
  const leg = new THREE.Mesh(GEO.rbox(0.032, 0.289, 0.032, 0.006), M.frame)
  leg.position.set(x, 0.1445, z); legs.add(leg)
  const foot = new THREE.Mesh(GEO.disc(0.026, 0.009, 0.003, 24), M.rubber)
  foot.position.set(x, 0.0045, z); feet.add(foot)
  feet.add(foot)
  const brace = new THREE.Mesh(GEO.rbox(0.016, 0.016, 0.16, 0.004), M.frame)
  brace.position.set(x, 0.05, 0); braces.add(brace)
}
frame.add(legs, feet, braces)
lab.add(frame, { name: 'frame', explode: [0, -0.10, 0], xray: 'shell', count: 12 })
lab.add(railL, { name: '侧轨 (上游侧)', explode: [0, 0.05, -0.24], count: 1 })
lab.add(railR, { name: '侧轨 (推杆侧)', explode: [0, 0.05, 0.24], count: 1 })

// 皮带
const beltG = new THREE.Group()
const band = new THREE.Mesh(GEO.rbox(0.634, 0.036, 0.066, 0.016), M.belt) // 实际带面宽 62 mm
band.position.set(0, 0.3260, 0) // 顶面 0.3440, 压在滚花带面 (0.3442) 之下, 避免穿出
const beltTop = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.062), beltTopM)
beltTop.rotation.x = -Math.PI / 2
beltTop.position.set(0, 0.3442, 0)
beltG.add(band, beltTop)
lab.add(beltG, { name: '皮带 (42 步进驱动)', explode: [0, 0.30, 0], count: 2, xray: 'shell' })

// 皮带轮 ×2
const pulL = new THREE.Group(), pulR = new THREE.Group()
function addPulley(dst, x) {
  const rimG = GEO.disc(0.021, 0.014, 0.0012, 28); rimG.rotateX(Math.PI / 2)
  dst.add(new THREE.Mesh(rimG, M.aluM))
  for (let i = 0; i < 4; i++) {
    const sp = new THREE.Mesh(GEO.rbox(0.034, 0.004, 0.007, 0.001), M.dark)
    sp.rotation.z = i * Math.PI / 2 + 0.4
    dst.add(sp)
  }
  const hubG = GEO.disc(0.0065, 0.018, 0.001, 16); hubG.rotateX(Math.PI / 2)
  dst.add(new THREE.Mesh(hubG, M.steel))
  dst.position.set(x, 0.3260, 0) // 随带体中心 (带体中心 0.3260)
}
addPulley(pulL, -0.317); addPulley(pulR, 0.317)
lab.add(pulL, { name: '主动轮 (驱动端)', explode: [-0.20, 0.18, 0], count: 6 })
lab.add(pulR, { name: '张紧轮 (尾端)', explode: [0.20, 0.18, 0], count: 6 })

// 步进电机 + 电机板
const motorG = new THREE.Group()
const mBody = new THREE.Mesh(GEO.rbox(0.055, 0.042, 0.042, 0.005), M.dark); mBody.position.set(-0.335, 0.329, 0.062); motorG.add(mBody)
const mFan = new THREE.Mesh(GEO.rbox(0.014, 0.05, 0.05, 0.004), M.steel); mFan.position.set(-0.367, 0.329, 0.062); motorG.add(mFan)
const mShaftG = GEO.disc(0.0035, 0.03, 0.0005, 12); mShaftG.rotateX(Math.PI / 2)
const mShaft = new THREE.Mesh(mShaftG, M.steel); mShaft.position.set(-0.312, 0.329, 0); motorG.add(mShaft)
const mPlate = new THREE.Mesh(GEO.rbox(0.08, 0.006, 0.06, 0.002), M.alu); mPlate.position.set(-0.33, 0.353, 0.062); motorG.add(mPlate)
for (const [dx, dz] of [[-0.022, 0.0145], [0.022, 0.0145], [-0.022, -0.012], [0.022, -0.012]]) {
  const s = new THREE.Mesh(GEO.disc(0.0028, 0.005, 0.0004, 10), M.steel)
  s.rotation.x = Math.PI / 2
  s.position.set(-0.335 + dx, 0.350, 0.062 + dz); motorG.add(s)
}
lab.add(motorG, { name: 'NEMA23 42 步进 + SERVO42C', explode: [-0.24, 0.22, 0.10], count: 6 })

// 驱动器 (铝壳散热片)
const drvG = new THREE.Group()
const dBody = new THREE.Mesh(GEO.rbox(0.045, 0.052, 0.026, 0.003), M.alu); dBody.position.set(-0.352, 0.332, 0.115); drvG.add(dBody)
for (let i = 0; i < 5; i++) {
  const fin = new THREE.Mesh(GEO.rbox(0.04, 0.004, 0.024, 0.001), M.aluM)
  fin.position.set(-0.352, 0.344 + i * 0.009, 0.115); drvG.add(fin)
}
const dTerm = new THREE.Mesh(GEO.rbox(0.03, 0.012, 0.014, 0.002), M.dark); dTerm.position.set(-0.352, 0.308, 0.115); drvG.add(dTerm)
lab.add(drvG, { name: 'SERVO42C 闭环驱动器', explode: [-0.30, 0.08, 0.24], count: 7 })

// ESP32 控制盒 (edge101)
const espG = new THREE.Group()
const ePcb = new THREE.Mesh(GEO.rbox(0.056, 0.040, 0.026, 0.003), M.pcb); ePcb.position.set(-0.02, 0.368, -0.115); espG.add(ePcb)
const eUsb = new THREE.Mesh(GEO.rbox(0.012, 0.012, 0.028, 0.002), M.steel); eUsb.position.set(0.018, 0.372, -0.115); espG.add(eUsb)
const eChip = new THREE.Mesh(GEO.rbox(0.014, 0.004, 0.012, 0.001), M.dark); eChip.position.set(-0.03, 0.389, -0.115); espG.add(eChip)
const ePost = new THREE.Mesh(GEO.rbox(0.03, 0.034, 0.022, 0.004), M.frame); ePost.position.set(-0.02, 0.347, -0.115); espG.add(ePost)
const eName = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.014), new THREE.MeshBasicMaterial({
  map: textTex(512, 144, (g, w, h) => {
    g.fillStyle = '#0b0e13'; g.fillRect(0, 0, w, h)
    g.fillStyle = '#e8b04a'; g.font = '600 64px "JetBrains Mono", monospace'
    g.fillText('edge101', 24, 88)
    g.fillStyle = '#9aa3b2'; g.font = '500 34px "Noto Sans SC", sans-serif'
    g.fillText('ESP32 · DFRobot 分拣线', 168, 86)
  }), transparent: true, side: THREE.DoubleSide }))
eName.position.set(-0.02, 0.368, -0.0965); espG.add(eName)
lab.add(espG, { name: 'ESP32 控制盒 (edge101)', explode: [0.10, 0.28, -0.18], count: 5 })

// 线缆 (动力 / I2C / 推杆信号)
const wireG = new THREE.Group()
const wire1 = new THREE.Mesh(GEO.pipe([[-0.35, 0.355, 0.105], [-0.31, 0.39, -0.02], [-0.16, 0.405, -0.09], [-0.055, 0.385, -0.112]], 0.0022), M.dark)
const wire2 = new THREE.Mesh(GEO.pipe([[0.018, 0.375, -0.12], [X_CAM + 0.05, 0.46, -0.155], [X_CAM + 0.006, 0.512, -0.105]], 0.0018), M.dark)
const wire3 = new THREE.Mesh(GEO.pipe([[0.0, 0.372, -0.115], [0.06, 0.355, -0.133], [0.16, 0.352, -0.135]], 0.0018), M.dark)
wireG.add(wire1, wire2, wire3)
lab.add(wireG, { name: '线缆 (动力/信号)', explode: [0.06, 0.24, -0.04], count: 3 })

// ---------- HuskyLens2 (俯视相机) ----------
const camG = new THREE.Group()
const cBase = new THREE.Mesh(GEO.rbox(0.14, 0.012, 0.08, 0.003), M.frame); cBase.position.set(X_CAM, 0.302, -0.13); camG.add(cBase)
const cCol = new THREE.Mesh(GEO.rbox(0.024, 0.25, 0.024, 0.005), M.frame); cCol.position.set(X_CAM, 0.42, -0.162); camG.add(cCol)
const cArm = new THREE.Mesh(GEO.rbox(0.028, 0.022, 0.135, 0.008), M.frame); cArm.position.set(X_CAM, 0.535, -0.095); camG.add(cArm)
const cBody = new THREE.Mesh(GEO.rbox(0.034, 0.02, 0.028, 0.005), M.white); cBody.position.set(X_CAM, 0.51, -0.045); camG.add(cBody)
const cLensG = GEO.disc(0.0078, 0.009, 0.001, 24)
const cLens = new THREE.Mesh(cLensG, M.glass); cLens.position.set(X_CAM, 0.495, -0.045); camG.add(cLens)
const cLed = new THREE.Mesh(new THREE.TorusGeometry(0.0092, 0.0013, 8, 32), M.hlLed)
cLed.rotation.x = Math.PI / 2; cLed.position.set(X_CAM, 0.498, -0.045); camG.add(cLed)
const cScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.021, 0.012), new THREE.MeshBasicMaterial({
  map: textTex(256, 144, (g, w, h) => {
    g.fillStyle = '#05070b'; g.fillRect(0, 0, w, h)
    g.fillStyle = '#7ee0a8'; g.font = '600 44px "JetBrains Mono", monospace'
    g.fillText('HL2 · 129', 18, 58)
    g.fillStyle = '#8a93a3'; g.font = '400 30px "JetBrains Mono", monospace'
    g.fillText('yolov8n 864×486 @15fps', 18, 104)
    ;['#62a5fa', '#fa943d', '#f25252', '#9d63d0'].forEach((cc, i) => { g.fillStyle = cc; g.fillRect(18 + i * 26, 120, 18, 14) })
  }), transparent: true, side: THREE.DoubleSide }))
cScreen.rotation.x = -Math.PI / 2; cScreen.position.set(X_CAM, 0.5205, -0.045); camG.add(cScreen)
// FOV 锥 (相机视野 → 带面)
const fovMat = new THREE.MeshBasicMaterial({ color: 0x6fe0a8, transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide })
const fovGeo = new THREE.BufferGeometry()
{
  const x = X_CAM, yT = 0.492, zT = -0.045
  const v = [
    [x - 0.008, yT, zT - 0.006], [x + 0.008, yT, zT - 0.006], [x + 0.008, yT, zT + 0.006], [x - 0.008, yT, zT + 0.006],
    [x - 0.095, 0.345, -0.048], [x + 0.095, 0.345, -0.048], [x + 0.095, 0.345, 0.048], [x - 0.095, 0.345, 0.048],
  ]
  const idx = [0, 1, 2, 0, 2, 3, 4, 5, 6, 4, 6, 7, 0, 3, 7, 0, 7, 4, 1, 2, 6, 1, 6, 5]
  fovGeo.setIndex(idx)
  fovGeo.setAttribute('position', new THREE.Float32BufferAttribute(v.flat(), 3))
  fovGeo.computeVertexNormals()
}
const fovCone = new THREE.Mesh(fovGeo, fovMat); camG.add(fovCone)
lab.add(camG, { name: 'HuskyLens 2 (俯视识别)', explode: [0, 0.24, -0.16], count: 8 })

// ---------- IR T0 光幕 ----------
const irG = new THREE.Group()
const irBar = new THREE.Mesh(GEO.rbox(0.016, 0.014, 0.15, 0.004), M.alu)
irBar.position.set(X_IR, 0.375, 0); irG.add(irBar)
for (const dz of [-0.068, 0.068]) {
  const post = new THREE.Mesh(GEO.rbox(0.012, 0.02, 0.012, 0.003), M.alu)
  post.position.set(X_IR, 0.364, dz); irG.add(post)
  const head = new THREE.Mesh(GEO.rbox(0.011, 0.009, 0.014, 0.002), M.dark)
  head.position.set(X_IR, 0.357, dz * 0.7); irG.add(head)
}
const beamMat = new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true, opacity: 0.12, depthWrite: false })
const beam = new THREE.Mesh(new THREE.BoxGeometry(0.0016, 0.0016, 0.096), beamMat)
beam.position.set(X_IR, 0.357, 0); irG.add(beam)
lab.add(irG, { name: 'IR T0 光幕 (触发点)', explode: [0, 0.18, 0], count: 6 })

// ---------- 推杆 ×3 (宽角伺服 + Scotch-yoke 曲柄连杆, 位于皮带对向侧, 停带时把工件推进仓库) ----------
const pushers = []
function buildPusher(i) {
  const xb = X_B[i]
  const g = new THREE.Group()
  const armM = new THREE.Mesh(GEO.rbox(0.02, 0.012, 0.08, 0.004), M.rail)
  armM.position.set(xb + 0.032, 0.302, -0.122); g.add(armM)
  const postM = new THREE.Mesh(GEO.rbox(0.024, 0.036, 0.024, 0.004), M.rail)
  postM.position.set(xb + 0.032, 0.322, -0.1335); g.add(postM)
  const servo = new THREE.Mesh(GEO.rbox(0.03, 0.028, 0.03, 0.004), M.dark)
  servo.position.set(xb + 0.032, 0.352, -0.1335); g.add(servo)
  const servoCap = new THREE.Mesh(GEO.rbox(0.026, 0.006, 0.026, 0.002), M.steel)
  servoCap.position.set(xb + 0.032, 0.367, -0.1335); g.add(servoCap)
  const crank = new THREE.Group()
  crank.position.set(xb, 0.352, CRANK_Z)
  const discG = GEO.disc(0.036, 0.006, 0.0008, 28); discG.rotateZ(Math.PI / 2)
  crank.add(new THREE.Mesh(discG, M.aluM))
  const pinG = GEO.disc(0.0026, 0.013, 0.0004, 12); pinG.rotateZ(Math.PI / 2)
  const pin = new THREE.Mesh(pinG, M.steel); pin.position.set(0, R, 0); crank.add(pin)
  const horn = new THREE.Mesh(GEO.rbox(0.003, 0.019, 0.0022, 0.0008), M.gold)
  horn.position.set(0.0045, 0.0095, 0); crank.add(horn)
  g.add(crank)
  const shaftG = GEO.disc(0.003, 0.018, 0.0004, 12); shaftG.rotateZ(Math.PI / 2)
  const shaft = new THREE.Mesh(shaftG, M.steel); shaft.position.set(xb + 0.0105, 0.352, CRANK_Z); g.add(shaft)
  const plate = new THREE.Mesh(GEO.rbox(0.008, 0.05, 0.046, 0.002), M.alu)
  plate.position.set(xb, 0.352, CRANK_Z - R); g.add(plate)
  const slot = new THREE.Mesh(GEO.rbox(0.0014, 0.043, 0.037, 0.0004), M.dark)
  slot.position.set(0.0048, 0, 0); plate.add(slot)
  for (const dy of [-0.016, 0.016]) {
    const rod = new THREE.Mesh(GEO.disc(0.0016, 0.058, 0.0002, 8), M.steel)
    rod.rotation.x = Math.PI / 2
    rod.position.set(xb, 0.352 + dy, -0.133); g.add(rod)
  }
  const rodM = new THREE.Mesh(GEO.rbox(0.007, 0.007, ROD_L - 0.005, 0.001), M.steel)
  rodM.position.set(xb, 0.352, CRANK_Z - R + (ROD_L - 0.005) / 2); g.add(rodM)
  const tipM = new THREE.Mesh(GEO.rbox(0.034, 0.024, 0.005, 0.001), i === 2 ? M.white : M.aluM)
  tipM.position.set(xb, 0.349, CRANK_Z - R + ROD_L - 0.0025); g.add(tipM)
  g.userData = { crank, plate, rodM, tipM, e: 0, mode: 'idle', t0: 0, item: null }
  pusherKin(g.userData)
  lab.add(g, { name: `推杆 ${i + 1} (宽角伺服·直槽滑块)`, explode: [0, 0.12, -(0.28 + i * 0.06)], count: 10 })
  pushers.push(g.userData)
}

// ---------- 上料物 (4 类传感器模块, 按实物产品照片逐件建模) ----------
// 共同特征: 黑色 PCB 板 · 金色定位孔 · 白/奶白排针端子 · 丝印
const M_PCB = MAT.paint({ color: [0.026, 0.028, 0.034], roughness: 0.3, clearcoat: 0.5 })
const M_PCB_GREEN = MAT.paint({ color: [0.05, 0.24, 0.10], roughness: 0.35, clearcoat: 0.4 }) // DFRobot 绿板 (超声波实物)
const M_CREAM = MAT.paint({ color: [0.80, 0.73, 0.58], roughness: 0.5, clearcoat: 0.15 })
const M_SILK = MAT.glow({ emissive: [0.92, 0.92, 0.85], emissiveIntensity: 0.16 })
const M_DHT_HOLE = MAT.paint({ color: [0.52, 0.52, 0.55], roughness: 0.5 })        // DHT20 顶面方孔 (中灰, 在黑盒上清晰可辨)
const M_PIR_RING = MAT.paint({ color: [0.40, 0.41, 0.45], roughness: 0.5 })        // PIR 透镜菲涅尔环 (中灰, 在白半球上清晰可辨)
const M_KNOB = MAT.paint({ color: [0.05, 0.05, 0.055], roughness: 0.45, clearcoat: 0.35 })  // 旋钮黑壳
const M_KNOB_RIB = MAT.paint({ color: [0.14, 0.14, 0.15], roughness: 0.55 })       // 旋钮竖肋 (比壳体略亮, 防滑纹凸显)
const M_ULTRA = MAT.paint({ color: [0.032, 0.032, 0.038], roughness: 0.42, clearcoat: 0.25 }) // 超声波换能器黑壳 (降高光)
const M_GRILLE = MAT.paint({ color: [0.42, 0.43, 0.46], roughness: 0.5 })          // 换能器顶面格栅 (浅灰, 在黑壳上凸显)
const M_DHT = MAT.paint({ color: [0.028, 0.028, 0.033], roughness: 0.68, clearcoat: 0.10 }) // DHT20 传感盒 (哑光, 抑制白色高光)
const M_POT = MAT.paint({ color: [0.13, 0.21, 0.58], roughness: 0.35, clearcoat: 0.4 })    // 电位器蓝壳
function makeItem(kind) {
  const g = new THREE.Group()
  const col = MATCOL[kind] || [0.6, 0.6, 0.62]
  let wz = 0.02, L = 0.045
  let tagX = null, tagZ = null                                    // 色标位置 (默认 +x+z 角, 可覆盖避让)
  const y0 = 0.0009                                              // 板顶面
  const addBoard = (mat = M_PCB) => g.add(new THREE.Mesh(GEO.rbox(L, 0.0018, wz, 0.001), mat))
  const hole = (x, z) => {                                       // 金色定位孔 (金环 + 通孔)
    const r = new THREE.Mesh(GEO.disc(0.0024, 0.0005, 0.0002, 18, 0.0011), M.gold)
    r.position.set(x, y0 + 0.00025, z); g.add(r)
  }
  const header = (x, n, len, mat = M.white) => {                 // 排针端子 (本体 + 针脚)
    const b = new THREE.Mesh(GEO.rbox(0.0062, 0.0056, len, 0.0008), mat)
    b.position.set(x, y0 + 0.0028, 0); g.add(b)
    for (let i = 0; i < n; i++) {
      const p = new THREE.Mesh(GEO.rbox(0.0016, 0.0014, 0.0016, 0.0003), M.dark)
      p.position.set(x + 0.0014, y0 + 0.006, -len / 2 + 0.0022 + i * ((len - 0.0044) / Math.max(1, n - 1)))
      g.add(p)
    }
  }
  const silk = (x, z, w, d) => {                                 // 丝印 (平面发光)
    const s = new THREE.Mesh(new THREE.PlaneGeometry(w, d), M_SILK)
    s.rotation.x = -Math.PI / 2; s.position.set(x, y0 + 0.00012, z); g.add(s)
  }
  const smd = (x, z, w, d) => {                                  // 贴片元件
    const c = new THREE.Mesh(GEO.rbox(w, 0.0012, d, 0.0002), M.dark)
    c.position.set(x, y0 + 0.0006, z); g.add(c)
  }
  switch (kind) {
    case 'ultrasonic_sensor': {
      // 超声波: DFRobot 绿板, 两只大号黑色圆柱换能器 (斜向错开), 顶面凹陷盘 + 黑色十字格栅 + 银色振膜中心 (按实物照片), DFRobot 丝印
      L = 0.050; wz = 0.034
      tagX = -L / 2 + 0.008                                       // 色标移到 -x+z 角, 避开右上换能器
      addBoard(M_PCB_GREEN)
      for (const [tx, tz] of [[-0.010, -0.009], [0.014, 0.008]]) {
        const body = new THREE.Mesh(GEO.disc(0.0075, 0.0112, 0.0018, 30), M_ULTRA) // 黑色圆柱换能器 (略加高)
        body.position.set(tx, y0 + 0.0056, tz); g.add(body)
        const dish = new THREE.Mesh(GEO.disc(0.0057, 0.0004, 0.00005, 28), M.dark)  // 顶面凹陷盘 (暗, 低于边缘一圈)
        dish.position.set(tx, y0 + 0.0106, tz); g.add(dish)
        for (let s = 0; s < 4; s++) {                             // 黑色十字格栅 (4 臂, 凸起)
          const a = s * Math.PI / 2
          const arm = new THREE.Mesh(GEO.rbox(0.0046, 0.0008, 0.0015, 0.0006), M_ULTRA)
          arm.position.set(tx + Math.cos(a) * 0.0027, y0 + 0.0110, tz + Math.sin(a) * 0.0027)
          arm.rotation.y = -a; g.add(arm)
        }
        const ctr = new THREE.Mesh(GEO.disc(0.0017, 0.0005, 0.0001, 18), M.aluM)   // 银色振膜中心 (金属)
        ctr.position.set(tx, y0 + 0.0113, tz); g.add(ctr)
      }
      silk(0, 0, 0.010, 0.0035)                                   // DFRobot 标识
      header(-0.0215, 3, 0.009)
      hole(-0.023, -0.015); hole(0.023, -0.015)
      break
    }
    case 'pir_sensor': {
      // 人体红外: 黑 40×24 板, 前端大号白色菲涅尔半球透镜, 中部贴片, 后端 4P 白端子, 左侧 2 金孔
      L = 0.040; wz = 0.024
      addBoard()
      const dome = new THREE.Mesh(new THREE.SphereGeometry(0.0100, 28, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.white)
      dome.position.set(-0.0128, y0, 0); g.add(dome)
      for (const hf of [0.0018, 0.0034, 0.0048, 0.0060, 0.0070]) {  // 菲涅尔环纹 (同心环, 中灰凸显)
        const rr = Math.sqrt(0.01 * 0.01 - hf * hf)
        const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.0003, 8, 48), M_PIR_RING)
        ring.rotation.x = Math.PI / 2; ring.position.set(-0.0128, y0 + hf, 0); g.add(ring)
      }
      smd(0.002, 0.004, 0.006, 0.0035)
      for (const [sx, sz] of [[0.006, -0.005], [0.010, -0.005], [0.006, 0.006], [0.010, 0.006]]) smd(sx, sz, 0.0016, 0.0009)
      silk(0.012, -0.006, 0.012, 0.003)
      header(0.0168, 4, 0.0115)
      hole(-0.004, 0.0095); hole(-0.004, -0.0095)
      break
    }
    case 'temp_humidity_sensor': {
      // 温湿度 DHT20: 黑 32×24 板, 前端黑色方形传感盒 (顶面网格), 后端奶白 4P, 2 金孔
      L = 0.032; wz = 0.024
      addBoard()
      const box = new THREE.Mesh(GEO.rbox(0.0155, 0.0060, 0.0098, 0.0014), M_DHT)
      box.position.set(-0.0078, y0 + 0.0030, 0); g.add(box)
      const topY = y0 + 0.0060
      for (let i = -2; i <= 2; i++)                               // 顶面 5×5 方形开窗 (暗格孔)
        for (let j = -2; j <= 2; j++) {
          const h = new THREE.Mesh(new THREE.PlaneGeometry(0.0017, 0.0013), M_DHT_HOLE)
          h.rotation.x = -Math.PI / 2
          h.position.set(-0.0078 + i * 0.0031, topY + 0.00006, j * 0.00195)
          g.add(h)
        }
      header(0.012, 4, 0.011, M_CREAM)
      silk(0.002, -0.0095, 0.014, 0.0028)
      hole(0.003, -0.0095); hole(0.008, -0.0095)
      break
    }
    case 'angle_sensor': {
      // 角度传感器: 近方 30×30 板, 蓝色电位器座 + 银色基座 + 黑色旋钮 (侧面白色指示线, 随角度摆动), 后端 3P, 2 金孔
      L = 0.030; wz = 0.030
      addBoard()
      const blue = new THREE.Mesh(GEO.rbox(0.0115, 0.0044, 0.013, 0.0012), M_POT)
      blue.position.set(-0.0035, y0 + 0.0022, 0); g.add(blue)
      const base = new THREE.Mesh(GEO.rbox(0.0105, 0.0018, 0.0115, 0.0008), M.aluM)
      base.position.set(-0.0035, y0 + 0.0044 + 0.0009, 0); g.add(base)
      const knobG = new THREE.Group(); knobG.position.set(-0.0035, y0 + 0.0044 + 0.0018, 0)
      const knob = new THREE.Mesh(GEO.disc(0.0058, 0.0062, 0.0008, 30), M_KNOB)
      knob.position.y = 0.0031; knobG.add(knob)
      for (let k = 0; k < 16; k++) {                               // 旋钮竖肋 (防滑纹, 略亮凸显)
        const a = k * Math.PI * 2 / 16
        const rib = new THREE.Mesh(new THREE.BoxGeometry(0.0010, 0.0046, 0.0006), M_KNOB_RIB)
        rib.position.set(Math.cos(a) * 0.00585, 0.0031, Math.sin(a) * 0.00585)
        rib.rotation.y = -a; knobG.add(rib)
      }
      const ind = new THREE.Mesh(GEO.rbox(0.0042, 0.0006, 0.0013, 0.0002), M.white)  // 白色指示标 (顶面径向, 随旋钮转动)
      ind.position.set(0.0033, 0.0062, 0); knobG.add(ind)
      g.add(knobG); g.userData.arm = knobG
      header(0.0125, 3, 0.010)
      silk(0.004, -0.0095, 0.012, 0.0028)
      hole(-0.0125, 0.0125); hole(0.0125, -0.0125)
      break
    }
    default: {
      L = 0.040; wz = 0.020
      addBoard()
    }
  }
  // 物料色标 (与列表/语音播报颜色一致, 便于区分)
  const tag = new THREE.Mesh(GEO.rbox(0.005, 0.002, 0.005, 0.0005), MAT.glow({ emissive: col, emissiveIntensity: 1.1 }))
  tag.position.set(tagX ?? (L / 2 - 0.008), 0.002, tagZ ?? (wz / 2 - 0.0035))
  g.add(tag)
  g.userData.wz = wz
  return g
}

// ---------- 状态机 ----------
const sim = {
  t: 0,
  items: [],
  spawnN: 0, nextSpawn: 0.6,
  fwq: 0, phantom: false, fault: false,
  irLit: false,
  visionLabel: '', visionUntil: 0, fovPulse: 0,
  doneTimes: [],
  src: new URLSearchParams(location.search).get('src') === 'device' ? 'device' : 'sim',
  jobs: [],
  live: { online: false, beltOn: false, fault: null, ir: false, lastVev: 0, lastSort: [0, 0, 0], lastMat: null },
}

function jobPop() {
  while (sim.jobs.length) {
    const j = sim.jobs[0]
    if (j.qty > 0) {
      j.qty--
      const out = { kind: j.kind, bin: j.bin }
      if (j.qty <= 0) sim.jobs.shift()
      return out
    }
    sim.jobs.shift()
  }
  return null
}
function spawnItem(kind, bin, x, z) {
  if (sim.items.length > 26) return
  const mesh = makeItem(kind)
  mesh.scale.setScalar(0.01)
  mesh.position.set(x, 0.3453, z) // 板底 0.3444, 坐在滚花带面 (0.3442) 上, 不嵌进带体
  lab.root.add(mesh)
  sim.items.push({ x, z, kind, bin, mesh, ph: 'belt', t0: sim.t, s: 0, seen: false, arm: mesh.userData.arm || null })
}
function autoSpawn() {
  const j = jobPop()
  let kind, bin
  if (j) { kind = j.kind; bin = j.bin }
  else {
    const n = sim.spawnN
    kind = KINDS[(n * 5 + 3) % 4]
    bin = MATMAP[kind]
  }
  sim.spawnN++
  const z = ITEM_Z0 + 0.0025 * Math.sin(sim.spawnN * 2.399)
  spawnItem(kind, bin, X_CAM - 0.065, z)
}
function removeItem(it) {
  it.mesh.traverse(o => { if (o.geometry) o.geometry.dispose() })
  lab.root.remove(it.mesh)
  sim.items = sim.items.filter(x => x !== it)
}

// 推杆运动学: e 0=内位(缩回) 1=外位(推出). 曲柄在皮带对向侧 (−z),
// 推板把工件沿 +z 方向推过带边进仓; 返回推板面 z
function pusherKin(p) {
  const th = -Math.PI / 2 + p.e * Math.PI
  p.crank.rotation.x = th
  const zy = CRANK_Z + R * Math.sin(th)
  p.plate.position.z = zy
  p.rodM.position.z = zy + (ROD_L - 0.005) / 2
  p.tipM.position.z = zy + ROD_L - 0.0025
  return zy + ROD_L
}

// ---------- 每帧 ----------
const tsS = lab.slider({ id: 'ts', label: '时间加速', min: 1, max: 16, value: 4, unit: '×', ends: ['1×', '16×'], digits: 0 })

lab.onTick((dt) => {
  const perf = performance.now() / 1000
  const ts = sim.src === 'sim' ? tsS.value : 1
  const dts = dt * ts
  sim.t += dts

  const anyBusy = pushers.some(p => p.mode === 'ejecting' || p.mode === 'hold')
  const beltRun = sim.src === 'sim' ? (!sim.fault && !anyBusy) : (sim.live.beltOn && !sim.live.fault)

  if (beltRun) {
    treadTex.offset.x -= (V * dts) / TREAD_TILE
    const w = (V / 0.021) * dts
    pulL.rotation.z -= w
    pulR.rotation.z -= w
  }

  if (sim.src === 'sim' && sim.t >= sim.nextSpawn && sim.items.length < 26) {
    autoSpawn()
    sim.nextSpawn = sim.t + 2.1 + (sim.spawnN % 3) * 0.55
  }

  // 沿 +x 流向: 队首 = 最靠出口 (x 最大), 其余依次跟随, 间距 55 mm
  const sorted = sim.items.slice().sort((a, b) => b.x - a.x)
  for (let i = 0; i < sorted.length; i++) {
    const it = sorted[i]
    const ahead = i > 0 ? sorted[i - 1] : null
    if (it.ph === 'belt') {
      if (beltRun) {
        let nx = it.x + V * dts
        if (ahead && ahead.ph !== 'chute' && ahead.ph !== 'land') nx = Math.min(nx, ahead.x - 0.055)
        if (it.bin >= 1 && it.bin <= 3) {
          const lane = it.bin - 1, p = pushers[lane]
          // sim 模式: 件到推杆位自动推 (演示动画). device 模式: 推杆只认真实
          // motion 事件 (pollTwin busy) — 无指令物料直通带尾, 3D 不假装推
          // (2026-11-19 用户报"真实源下推杆自己动、真推杆不动": 即此动画假象)
          if (sim.src === 'sim' && nx >= X_B[lane] - 0.012 && p.mode === 'idle') {
            nx = X_B[lane] - 0.012
            it.ph = 'hold'; p.item = it; p.mode = 'ejecting'; p.e = 0; p.t0 = sim.t
          }
        }
        it.x = nx
      }
      if (it.x > 0.322) { removeItem(it); continue }
      if (!it.seen && it.x >= X_CAM) {
        it.seen = true
        if (sim.src === 'sim') sim.fwq = Math.min(FIFO, sim.fwq + (sim.phantom ? 2 : 1))
        sim.visionLabel = `${MATCN[it.kind]} → ${it.bin} 号仓`
        sim.visionUntil = sim.t + 3
        sim.fovPulse = 1
      }
    } else if (it.ph === 'hold') {
      const p = pushers.find(q => q.item === it)
      if (p) {
        const face = pusherKin(p)
        it.z = Math.max(it.z, Math.min(face + it.mesh.userData.wz / 2, 0.044))
        it.mesh.position.set(it.x, 0.3453, it.z)
      }
    } else if (it.ph === 'chute') {
      it.s = 0.5 * 6.3 * (sim.t - it.t0) * (sim.t - it.t0)
      const s = Math.min(it.s, 0.145)
      const xb = X_B[it.bin - 1]
      it.mesh.position.set(xb, 0.345 - 0.7071 * s, 0.040 + 0.7071 * s)
      if (it.s >= 0.145) {
        it.ph = 'land'; it.t0 = sim.t
        sim.doneTimes.push(sim.t)
        sim.fwq = Math.max(0, sim.fwq - 1)
      }
    } else if (it.ph === 'land') {
      const xb = X_B[it.bin - 1]
      const k = clamp((sim.t - it.t0) / 0.25, 0, 1)
      it.mesh.position.set(xb, lerp(0.2425, 0.207, k), lerp(0.1425, 0.172, k))
      if (sim.t - it.t0 > 0.85) { removeItem(it); continue }
    }
    if (it.ph === 'belt') {
      it.mesh.position.set(it.x, 0.3453, it.z)
      if (it.mesh.scale.x < 1) it.mesh.scale.setScalar(Math.min(1, it.mesh.scale.x + dt * 8))
    }
    if (it.arm) it.arm.rotation.y = Math.sin(sim.t * 3 + it.x * 20) * 0.5
  }

  for (const p of pushers) {
    if (p.mode === 'ejecting') {
      p.e = Math.min(1, p.e + dts / EJECT_S)
      if (p.e >= 1) {
        if (p.item && p.item.ph === 'hold') { p.item.ph = 'chute'; p.item.t0 = sim.t }
        p.mode = 'hold'; p.t0 = sim.t
      }
    } else if (p.mode === 'hold') {
      if (sim.t - p.t0 >= HOLD_S) p.mode = 'retracting'
    } else if (p.mode === 'retracting') {
      p.e = Math.max(0, p.e - dts / RETRACT_S)
      if (p.e <= 0) { p.mode = 'idle'; p.item = null }
    }
    pusherKin(p) // 每帧把视觉位姿同步到当前 e；否则回缩/空闲后推杆停在推出位不收回
  }

  if (sim.fwq >= FIFO && !sim.fault) { sim.fault = true }

  sim.irLit = sim.items.some(it => it.x + 0.02 > X_IR && it.x - 0.02 < X_IR && (it.ph === 'belt' || it.ph === 'hold'))
  if (sim.src === 'device') sim.irLit = sim.irLit || sim.live.ir

  beamMat.opacity = lerp(beamMat.opacity, sim.irLit ? 0.85 : 0.10, 0.25)
  beamMat.color.set(sim.irLit ? 0x30ff70 : 0xff3b30)
  sim.fovPulse = Math.max(0, sim.fovPulse - dt * 1.4)
  fovMat.opacity = 0.045 + sim.fovPulse * 0.13
  M.hlLed.emissiveIntensity = sim.visionUntil > sim.t ? 2.6 + Math.sin(perf * 10) * 0.8 : 1.2
  M.beacon.emissiveIntensity = sim.fault || (sim.src === 'device' && sim.live.fault) ? 2.2 + Math.sin(perf * 9) * 1.6 : 0.12

  const recent = sim.doneTimes.filter(t => t > sim.t - 60)
  const rate = recent.length * 60
  const fault = sim.fault || (sim.src === 'device' && !!sim.live.fault)
  const state = fault ? 'FAULT · 队列满' : anyBusy ? '推送中 · 带停' : beltRun ? '运行中' : '带停'
  const srcNote = sim.src === 'device' ? (sim.live.online ? ' · 实时' : ' · 离线') : ''
  // device 模式不显示仿真队列计数 (固件 FIFO 未上 MQTT, 显示会是假数据)
  const sub = sim.src === 'sim'
    ? `带速 52.5 mm/s · 单件周期 1.62 s · HL2 下发队列 ${sim.fwq}/24${srcNote}`
    : `带速 52.5 mm/s · 单件周期 1.62 s${srcNote}`
  lab.setHero(rate, { state, sub, bad: fault })
})

// ---------- 实时模式: 轮询 /twin ----------
async function pollTwin() {
  const L = sim.live
  if (sim.src !== 'device') { L.online = false; return }
  let d = null
  try { d = await (await fetch('/twin')).json() } catch (e) { d = null }
  L.online = !!(d && d.online)
  if (!L.online) { L.beltOn = false; return }
  L.beltOn = d.conveyor === 'running'
  L.ir = !!d.ir_present
  L.fault = d.fault || null
  const vList = d.vision || []
  const vev = vList.length ? vList[vList.length - 1] : null
  if (vev && vev.ts) {
    const tms = Date.parse(vev.ts)
    if (tms > L.lastVev) {
      L.lastVev = tms
      L.lastMat = vev.material || null
      if (L.synced && vev.yard >= 1 && vev.yard <= 3) {
        spawnItem(vev.material || KINDS[0], vev.yard, X_CAM - 0.065, ITEM_Z0)
        sim.visionLabel = `${MATCN[vev.material] || vev.material} → ${vev.yard} 号仓`
        sim.visionUntil = sim.t + 3
        sim.fovPulse = 1
      }
    }
  }
  if (!L.synced) {
    // 首次进入实时: 静默对齐事件环最新时刻, 不回放历史推送动画
    L.synced = true
    for (const ev of d.events || []) {
      const n = ev.sorter
      if (n < 1 || n > 3) continue
      const tms = Date.parse(ev.ts) || 0
      if (tms > (L.lastSort[n - 1] || 0)) L.lastSort[n - 1] = tms
    }
    return
  }
  for (const ev of d.events || []) {
    if (!ev || ev.state == null) continue
    const n = ev.sorter
    if (n < 1 || n > 3) continue
    const tms = Date.parse(ev.ts) || 0
    if (tms <= L.lastSort[n - 1]) continue
    L.lastSort[n - 1] = tms
    const p = pushers[n - 1]
    if (ev.state === 'busy') {
      // 真实推送 (手动推杆/指令下发): 推杆伸出, 把工件推进仓库
      if (p.mode === 'ejecting' || p.mode === 'hold') continue
      let it = sim.items.find(q => q.ph === 'belt' && q.bin === n && q.x >= X_B[n - 1] - 0.07 && q.x <= X_B[n - 1] + 0.03)
      if (!it) {
        const kind = L.lastMat || KINDS[(n * 5 + 3) % 4]
        spawnItem(kind, n, X_B[n - 1] - 0.02, ITEM_Z0)
        it = sim.items[sim.items.length - 1]
      }
      if (it) {
        it.x = Math.max(it.x, X_B[n - 1] - 0.012)
        it.ph = 'hold'; p.item = it; p.mode = 'ejecting'; p.t0 = sim.t
      }
    } else if (ev.state === 'ready' || ev.state === 'idle') {
      // 真实推送完成 (固件已缩回): 补完推送动画, 随后缩回
      if (p.mode === 'ejecting') {
        p.e = 1
        if (p.item && p.item.ph === 'hold') { p.item.ph = 'chute'; p.item.t0 = sim.t }
        p.mode = 'retracting'; p.t0 = sim.t
      } else if (p.mode === 'hold') {
        p.mode = 'retracting'; p.t0 = sim.t
      }
    }
  }
}

function setSrc(v) {
  sim.src = v

  })
}

  bc3d.onmessage = (e) => {
    const m = e.data || {}
    if (m.type === 'job' && sim.src === 'sim' && m.items && m.items.length) window.__s3d.setJob(m.items)
    else if (m.type === 'src') setSrc(m.src === 'device' ? 'device' : 'sim')
  }
}

  setSrc: (v) => setSrc(v === 'device' ? 'device' : 'sim'),
